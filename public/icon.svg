<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <radialGradient id="bull" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#262626" stroke-width="12"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10b981" stroke-width="18" stroke-dasharray="28 2"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#262626" stroke-width="8"/>
  <circle cx="256" cy="256" r="105" fill="none" stroke="#f43f5e" stroke-width="16" stroke-dasharray="16 2"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#10b981" stroke-width="16"/>
  <circle cx="256" cy="256" r="28" fill="url(#bull)"/>
  
  <!-- Dart flight entering the board -->
  <g transform="translate(190, 190) rotate(45) scale(0.9)">
    <path d="M 0,0 L 20,-50 L 0,-120 L -20,-50 Z" fill="#38bdf8"/>
    <path d="M 0,-120 L 0,-200" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <polygon points="0,-200 -8,-160 8,-160" fill="#f59e0b"/>
  </g>
</svg>
